name: Temporary #48 browser persistence smoke

on:
  push:
    branches:
      - agent/48-persistence-trust

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/persistence-trust.spec.ts --reporter=line
