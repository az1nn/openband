name: OpenBand CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Graph Validation Gate
      run: npm run graph:ci

    - name: Frontend TypeScript Check
      run: npx tsc --noEmit

    - name: Backend TypeScript Check
      run: cd backend && npm install && npx tsc --noEmit

    - name: Vitest Suite
      run: npx vitest run

    - name: Legacy Node Test Suite
      run: npm run test:legacy

    - name: Production Web Export Build
      run: npm run build
