name: tmp-53-graph-evidence

on:
  push:
    branches:
      - agent/53-source-aware-region-split-trim

permissions:
  contents: read

jobs:
  graph-evidence:
    if: ${{ github.event.head_commit.message == 'chore-sdd-graph-53' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2514843ec7870ddab06c0309da19a16908333d86
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Design Baseline graph
        run: |
          npm run graph:build -- --fresh
          npm run graph:validate
          node graph/cli.mjs impact src/lib/types.ts
          node graph/cli.mjs impact src/lib/regionEdit.ts
          node graph/cli.mjs impact src/lib/midiSynth.ts
          node graph/cli.mjs impact src/lib/universalAudio.ts
          node graph/cli.mjs impact src/lib/projectStore.ts
      - uses: actions/checkout@v4
        with:
          ref: agent/53-source-aware-region-split-trim
          clean: true
      - name: Current HEAD graph
        run: |
          npm run graph:build -- --fresh
          npm run graph:validate
          npm run graph:ci
          node graph/cli.mjs impact src/lib/types.ts
          node graph/cli.mjs impact src/lib/regionEdit.ts
          node graph/cli.mjs impact src/lib/midiSynth.ts
          node graph/cli.mjs impact src/lib/universalAudio.ts
