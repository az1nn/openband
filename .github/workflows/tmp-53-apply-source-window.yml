name: tmp-53-apply-source-window

on:
  push:
    branches:
      - agent/53-source-aware-region-split-trim

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore(sdd): run #53 source-window implementation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/53-source-aware-region-split-trim
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply bounded #53 patch
        run: python .github/scripts/apply-53-source-window.py
      - name: Verify patch shape
        run: |
          git diff --check
          git diff --stat
          git diff -- src/lib/types.ts backend/src/types.ts src/lib/regionEdit.ts src/lib/midiSynth.ts src/lib/universalAudio.ts tests/sourceAwareRegion.test.ts tests/sourceAwareRender.test.ts
      - name: Install dependencies
        run: npm ci
      - name: Focused tests
        run: npx vitest run tests/sourceAwareRegion.test.ts tests/sourceAwareRender.test.ts tests/regionEdit.test.ts
      - name: Frontend typecheck
        run: npx tsc --noEmit
      - name: Backend typecheck
        run: cd backend && npm ci && npx tsc --noEmit
      - name: Commit implementation
        run: |
          git config user.name "Alan"
          git config user.email "80423834+az1nn@users.noreply.github.com"
          git add src/lib/types.ts backend/src/types.ts src/lib/regionEdit.ts src/lib/midiSynth.ts src/lib/universalAudio.ts tests/sourceAwareRegion.test.ts tests/sourceAwareRender.test.ts
          git commit -m "feat(audio): implement source-aware region windows"
          git push origin HEAD:agent/53-source-aware-region-split-trim
