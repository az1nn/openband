name: tmp-53-apply-source-window

on:
  push:
    branches:
      - agent/53-source-aware-region-split-trim

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'chore-sdd-review-53' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/53-source-aware-region-split-trim
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply audio-review correction
        run: python .github/scripts/apply-53-source-window.py
      - name: Verify patch shape
        run: |
          git diff --check
          git diff --stat
          git diff -- src/lib/universalAudio.ts tests/sourceAwareRender.test.ts
      - name: Install dependencies
        run: npm ci
      - name: Focused source-window tests
        run: npx vitest run tests/sourceAwareRegion.test.ts tests/sourceAwareRender.test.ts tests/regionEdit.test.ts
      - name: Frontend typecheck
        run: npx tsc --noEmit
      - name: Commit reviewed implementation
        run: |
          git config user.name "Alan"
          git config user.email "80423834+az1nn@users.noreply.github.com"
          git add src/lib/universalAudio.ts tests/sourceAwareRender.test.ts
          git commit -m "fix(audio): apply region window before track effects"
          git push origin HEAD:agent/53-source-aware-region-split-trim
