name: Temporary #48 executor repair

on:
  push:
    branches: [ agent/48-persistence-trust ]

permissions:
  contents: write

jobs:
  repair:
    if: contains(github.event.head_commit.message, 'repair persistence executor')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/48-persistence-trust
      - name: Repair workflow guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/tmp-impl-persistence-core-48.yml')
          text = p.read_text()
          old = "    if: github.event.head_commit.message == 'chore(impl): apply persistence core patch'"
          new = "    if: contains(github.event.head_commit.message, 'apply persistence core patch')"
          if old not in text:
              raise SystemExit('guard not found')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "OpenBand Agent"
          git config user.email "openband-agent@users.noreply.github.com"
          git add .github/workflows/tmp-impl-persistence-core-48.yml
          git commit -m "chore(impl): apply persistence core patch"
          git push origin HEAD:agent/48-persistence-trust
