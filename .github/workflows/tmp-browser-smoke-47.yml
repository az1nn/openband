name: Temporary #47 Browser Smoke

on:
  push:
    branches: [ agent/47-creative-loop ]

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create ephemeral creative-loop smoke
        run: |
          cat > e2e/creative-loop.tmp.spec.ts <<'EOF'
          import { test, expect } from "@playwright/test";

          test.use({
            permissions: ["microphone"],
            launchOptions: {
              args: [
                "--use-fake-device-for-media-stream",
                "--use-fake-ui-for-media-stream",
                "--autoplay-policy=no-user-gesture-required",
              ],
            },
          });

          test("visitor reaches first recorded sound and source-neutral region edits", async ({ page }) => {
            test.setTimeout(90000);

            await page.goto("/login");
            await expect(page.getByText("Entrar como Visitante")).toBeVisible({ timeout: 15000 });
            await page.getByText("Entrar como Visitante").click();
            await page.waitForURL(/\/tabs/, { timeout: 15000 });

            await page.goto("/tabs/library");
            await expect(page.getByText("Biblioteca")).toBeVisible({ timeout: 15000 });
            await page.getByText("Novo Projeto").first().click();
            await page.getByText("Começar do Zero").click();
            await page.waitForURL(/\/studio\/.*scratch=1/, { timeout: 15000 });

            await expect(page.getByText("Make your first sound")).toBeVisible({ timeout: 15000 });
            const startedAt = Date.now();

            await page.getByText("Record", { exact: true }).click();
            await page.waitForTimeout(1200);
            await page.getByText("Record", { exact: true }).click();

            await expect(page.getByText("Recording 1")).toBeVisible({ timeout: 20000 });
            expect(Date.now() - startedAt).toBeLessThan(60000);

            const regions = page.getByRole("button", { name: "Select region" });
            await expect(regions).toHaveCount(1);
            await regions.first().click();

            await page.getByText("Duplicate", { exact: true }).click();
            await expect(regions).toHaveCount(2);

            await page.getByText("Repeat ×4", { exact: true }).click();
            await expect(regions).toHaveCount(5);

            await page.getByText("Delete", { exact: true }).click();
            await expect(regions).toHaveCount(4);

            await page.getByRole("button", { name: "Undo" }).click();
            await expect(regions).toHaveCount(5);
            await page.getByRole("button", { name: "Redo" }).click();
            await expect(regions).toHaveCount(4);
          });
          EOF
      - name: Run browser/mic smoke
        run: npx playwright test e2e/creative-loop.tmp.spec.ts --workers=1
