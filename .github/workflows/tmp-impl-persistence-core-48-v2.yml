name: Temporary #48 persistence core implementation v2

on:
  push:
    branches: [ agent/48-persistence-trust ]

permissions:
  contents: write

jobs:
  implement-core:
    if: contains(github.event.head_commit.message, 'run persistence core implementation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/48-persistence-trust
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Patch persistence core and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(path: str, pattern: str, replacement: str):
              p = Path(path)
              text = p.read_text()
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected one replacement in {path}, got {count}: {pattern[:80]}")
              p.write_text(new)

          sub_once(
              'src/lib/assetStore.ts',
              r'function openDb\(\): Promise<IDBDatabase \| null> \{.*?\n\}',
              '''function openDb(): Promise<IDBDatabase> {
            if (typeof indexedDB === "undefined") {
              return Promise.reject(new Error("IndexedDB is not available"));
            }
            return new Promise((resolve, reject) => {
              const req = indexedDB.open("openband_assets", 1);
              req.onupgradeneeded = () => {
                const db = req.result;
                if (!db.objectStoreNames.contains("assets")) {
                  db.createObjectStore("assets", { keyPath: "id" });
                }
              };
              req.onsuccess = () => resolve(req.result);
              req.onerror = () => reject(req.error ?? new Error("IndexedDB open failed"));
              req.onblocked = () => reject(new Error("IndexedDB open blocked"));
            });
          }'''
          )
          sub_once(
              'src/lib/assetStore.ts',
              r'async function persistBytes\(id: string, blob: Blob\): Promise<void> \{.*?\n\}',
              '''async function persistBytes(id: string, blob: Blob): Promise<void> {
            if (Platform.OS !== "web") {
              memStore.set(id, blob);
              try {
                const base = await OpenBandNative.getDocumentsPath();
                await OpenBandNative.writeFile(assetPath(base, id), await blob.arrayBuffer());
                return;
              } catch {
                return;
              }
            }

            const db = await openDb();
            await new Promise<void>((resolve, reject) => {
              const tx = db.transaction("assets", "readwrite");
              tx.objectStore("assets").put({ id, blob });
              tx.oncomplete = () => resolve();
              tx.onerror = () => reject(tx.error ?? new Error("IndexedDB asset write failed"));
              tx.onabort = () => reject(tx.error ?? new Error("IndexedDB asset write aborted"));
            });
            memStore.set(id, blob);
          }'''
          )

          sub_once(
              'src/lib/projectStore.ts',
              r'export function saveProject\(\n  id: string,\n  data: Omit<ProjectData, "id" \| "lastSaved">,\n\): boolean \{.*?\n\}\n\nexport function loadProject',
              '''type ProjectIndexEntry = {
            title: string;
            lastSaved: number;
            genre?: string;
            key?: string;
            bpm?: number;
            coverUrl?: string;
            parentProjectId?: string;
          };

          type ProjectIndex = Record<string, ProjectIndexEntry>;

          function toIndexEntry(project: ProjectData): ProjectIndexEntry {
            return {
              title: project.title,
              lastSaved: project.lastSaved,
              genre: project.genre,
              key: project.key,
              bpm: project.bpm,
              coverUrl: project.coverUrl,
              parentProjectId: project.parentProjectId,
            };
          }

          function parseProjectIndex(raw: string | null): ProjectIndex | null {
            if (!raw) return null;
            try {
              const parsed = JSON.parse(raw);
              if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return null;
              return parsed as ProjectIndex;
            } catch {
              return null;
            }
          }

          function rebuildProjectIndex(storage: Storage): ProjectIndex {
            const rebuilt: ProjectIndex = {};
            for (let i = 0; i < storage.length; i++) {
              const key = storage.key(i);
              if (!key || key === INDEX_KEY || !key.startsWith(STORAGE_PREFIX)) continue;
              const raw = storage.getItem(key);
              if (!raw) continue;
              try {
                const project = sanitizeProjectData(JSON.parse(raw));
                if (!project) continue;
                const id = key.slice(STORAGE_PREFIX.length);
                rebuilt[id] = toIndexEntry({ ...project, id });
              } catch {
              }
            }
            return rebuilt;
          }

          function restoreStorageValue(storage: Storage, key: string, previous: string | null): void {
            try {
              if (previous === null) storage.removeItem(key);
              else storage.setItem(key, previous);
            } catch (e) {
              console.error("[projectStore] rollback failed for", key, e);
            }
          }

          export function saveProject(
            id: string,
            data: Omit<ProjectData, "id" | "lastSaved">,
          ): boolean {
            const project: ProjectData = { ...data, id, lastSaved: Date.now() };
            const storage = getStorage();
            if (Platform.OS === "web" && !storage) return false;
            if (storage) {
              const projectKey = STORAGE_PREFIX + id;
              const previousProject = storage.getItem(projectKey);
              const previousIndex = storage.getItem(INDEX_KEY);
              try {
                storage.setItem(projectKey, JSON.stringify(project));
                const index = parseProjectIndex(previousIndex) ?? rebuildProjectIndex(storage);
                index[id] = toIndexEntry(project);
                storage.setItem(INDEX_KEY, JSON.stringify(index));
                onProjectSavedListeners.forEach((cb) => cb(id, project));
              } catch (e) {
                restoreStorageValue(storage, projectKey, previousProject);
                restoreStorageValue(storage, INDEX_KEY, previousIndex);
                console.warn("Project save failed:", e);
                return false;
              }
            }
            queueBridgeSave(id, project);
            return true;
          }

          export function loadProject'''
          )
          sub_once(
              'src/lib/projectStore.ts',
              r'export function listProjectIndex\(\): Record<.*?\n\}\n\nexport function createRemix',
              '''export function listProjectIndex(): ProjectIndex {
            const storage = getStorage();
            if (!storage) return {};
            const raw = storage.getItem(INDEX_KEY);
            const parsed = parseProjectIndex(raw);
            if (parsed) return parsed;

            if (raw) {
              console.warn("[projectStore] project index is corrupt; rebuilding from project payloads");
            }
            const rebuilt = rebuildProjectIndex(storage);
            try {
              storage.setItem(INDEX_KEY, JSON.stringify(rebuilt));
            } catch (e) {
              console.warn("[projectStore] rebuilt index could not be persisted:", e);
            }
            return rebuilt;
          }

          export function createRemix'''
          )
          sub_once(
              'src/lib/projectStore.ts',
              r'      saveProject\(data\.id, data\);\n      return data\.id;',
              '''      return saveProject(data.id, data) ? data.id : null;'''
          )
          sub_once(
              'src/lib/projectStore.ts',
              r'  saveProject\(newId, \{\n    \.\.\.original,\n    title: `Remix: \$\{original\.title\}`,\n    parentProjectId: originalId,\n    isPublished: false,\n    coverUrl: undefined,\n  \}\);\n  return newId;',
              '''  const saved = saveProject(newId, {
            ...original,
            title: `Remix: ${original.title}`,
            parentProjectId: originalId,
            isPublished: false,
            coverUrl: undefined,
          });
          return saved ? newId : null;'''
          )

          Path('tests/helpers').mkdir(parents=True, exist_ok=True)
          Path('tests/helpers/fakeIndexedDb.ts').write_text(r'''export function createFakeIndexedDb() {
            const stores: Record<string, Map<string, unknown>> = {};
            let failWrites = false;
            let failOpen = false;

            const getStore = (name: string) => {
              if (!stores[name]) stores[name] = new Map();
              return stores[name];
            };

            class Req {
              result: any;
              error: any = null;
              onsuccess: ((e?: unknown) => void) | null = null;
              onerror: ((e?: unknown) => void) | null = null;
              onupgradeneeded: ((e?: unknown) => void) | null = null;
              onblocked: ((e?: unknown) => void) | null = null;
              constructor(result?: any) {
                this.result = result;
              }
            }

            class Tx {
              oncomplete: (() => void) | null = null;
              onerror: ((e?: unknown) => void) | null = null;
              onabort: ((e?: unknown) => void) | null = null;
              error: any = null;
              objectStore(name: string) {
                return new Store(name, this);
              }
              complete() {
                queueMicrotask(() => this.oncomplete?.());
              }
              fail() {
                this.error = new Error("QuotaExceededError");
                queueMicrotask(() => this.onerror?.({ target: this }));
              }
            }

            class Store {
              constructor(private name: string, private tx: Tx) {}
              put(record: { id: string }) {
                const req = new Req();
                if (failWrites) {
                  this.tx.fail();
                } else {
                  getStore(this.name).set(record.id, record);
                  queueMicrotask(() => req.onsuccess?.({ target: req }));
                  this.tx.complete();
                }
                return req;
              }
              get(id: string) {
                const req = new Req();
                queueMicrotask(() => {
                  req.result = getStore(this.name).get(id);
                  req.onsuccess?.({ target: req });
                });
                return req;
              }
              delete(id: string) {
                const req = new Req();
                getStore(this.name).delete(id);
                queueMicrotask(() => req.onsuccess?.({ target: req }));
                this.tx.complete();
                return req;
              }
            }

            class Db {
              objectStoreNames = { contains: (name: string) => !!stores[name] };
              createObjectStore(name: string) {
                getStore(name);
                return new Store(name, new Tx());
              }
              transaction(_name: string, _mode?: string) {
                return new Tx();
              }
            }

            const indexedDB = {
              open(_name: string, _version: number) {
                const db = new Db();
                const req = new Req(db);
                queueMicrotask(() => {
                  if (failOpen) {
                    req.error = new Error("IndexedDB open failed");
                    req.onerror?.({ target: req });
                    return;
                  }
                  if (!stores.assets) req.onupgradeneeded?.({ target: req });
                  req.onsuccess?.({ target: req });
                });
                return req;
              },
            };

            return {
              indexedDB,
              stores,
              setFailWrites(value: boolean) { failWrites = value; },
              setFailOpen(value: boolean) { failOpen = value; },
            };
          }
          ''')

          Path('tests/assetStore.test.ts').write_text(r'''import { describe, it, expect, beforeEach, afterEach, vi } from "vitest";
          import {
            saveAsset,
            resolveAssetUrl,
            resolveAssetUrlSync,
            revokeAssetCache,
            deleteAssetUrl,
            ASSET_PREFIX,
          } from "../src/lib/assetStore";
          import { createFakeIndexedDb } from "./helpers/fakeIndexedDb";

          let counter = 0;
          let idb: ReturnType<typeof createFakeIndexedDb>;

          function makeBlob(): Blob {
            return new Blob([new Uint8Array([1, 2, 3])], { type: "audio/wav" });
          }

          describe("assetStore", () => {
            beforeEach(() => {
              idb = createFakeIndexedDb();
              vi.stubGlobal("indexedDB", idb.indexedDB);
              vi.stubGlobal("URL", {
                createObjectURL: () => "blob:live-" + counter++,
                revokeObjectURL: vi.fn(),
              });
              revokeAssetCache();
              counter = 0;
            });

            afterEach(() => {
              vi.unstubAllGlobals();
            });

            it("saveAsset returns asset:// pointer only after IndexedDB stores bytes", async () => {
              const pointer = await saveAsset(makeBlob());
              expect(pointer.startsWith(ASSET_PREFIX)).toBe(true);
              const id = pointer.slice(ASSET_PREFIX.length);
              expect(idb.stores.assets?.has(id)).toBe(true);
              const live = await resolveAssetUrl(pointer);
              expect(live.startsWith("blob:")).toBe(true);
            });

            it("rejects rather than claiming durability when IndexedDB write fails", async () => {
              idb.setFailWrites(true);
              await expect(saveAsset(makeBlob())).rejects.toThrow("QuotaExceededError");
            });

            it("rejects when IndexedDB is unavailable", async () => {
              vi.stubGlobal("indexedDB", undefined);
              await expect(saveAsset(makeBlob())).rejects.toThrow("IndexedDB is not available");
            });

            it("resolveAssetUrl passes through https url unchanged", async () => {
              await expect(resolveAssetUrl("https://x/y.wav")).resolves.toBe("https://x/y.wav");
            });

            it("resolveAssetUrl passes through blob url unchanged", async () => {
              await expect(resolveAssetUrl("blob:https://x/abc")).resolves.toBe("blob:https://x/abc");
            });

            it("resolveAssetUrl reuses cached url", async () => {
              const pointer = await saveAsset(makeBlob());
              const a = await resolveAssetUrl(pointer);
              const b = await resolveAssetUrl(pointer);
              expect(a).toBe(b);
            });

            it("revokeAssetCache clears URL cache without deleting persisted bytes", async () => {
              const pointer = await saveAsset(makeBlob());
              await resolveAssetUrl(pointer);
              expect(() => revokeAssetCache()).not.toThrow();
              expect(resolveAssetUrlSync(pointer)).toBe(pointer);
              expect(idb.stores.assets?.has(pointer.slice(ASSET_PREFIX.length))).toBe(true);
            });

            it("deleteAssetUrl removes cached pointer and persisted bytes", async () => {
              const pointer = await saveAsset(makeBlob());
              const live = await resolveAssetUrl(pointer);
              expect(live.startsWith("blob:")).toBe(true);
              deleteAssetUrl(pointer);
              await new Promise((resolve) => setTimeout(resolve, 0));
              expect(resolveAssetUrlSync(pointer)).toBe(pointer);
              expect(idb.stores.assets?.has(pointer.slice(ASSET_PREFIX.length))).toBe(false);
            });
          });
          ''')

          Path('tests/persistenceTrust.test.ts').write_text(r'''import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";
          import { createFakeIndexedDb } from "./helpers/fakeIndexedDb";

          const project = {
            title: "Persistence",
            genre: "rock",
            key: "E",
            bpm: 120,
            tracks: [],
            groups: [],
            buses: [],
            trackAssignments: {},
            masterPlugins: [],
            masteringChain: [],
            sendBuses: [],
            trackAmpChains: {},
            mixSnapshots: [],
            activeMixId: undefined,
            metronome: { bpm: 120, timeSig: [4, 4] as [number, number], accentInterval: 4, volume: 0.5, enabled: false, countIn: false, countInBars: 2 },
            recordSettings: { armed: false, inputSource: "mic" as const, quality: "high" as const, sampleRate: 44100 as const, mono: false, preRoll: 0 },
          };

          beforeEach(() => {
            localStorage.clear();
          });

          afterEach(() => {
            vi.restoreAllMocks();
            vi.unstubAllGlobals();
            localStorage.clear();
          });

          describe("persistence trust", () => {
            it("rebuilds a missing project index from valid project payloads", async () => {
              const { saveProject, listProjectIndex } = await import("../src/lib/projectStore");
              expect(saveProject("p1", project)).toBe(true);
              localStorage.removeItem("openband_project_index");
              expect(listProjectIndex().p1.title).toBe("Persistence");
              expect(JSON.parse(localStorage.getItem("openband_project_index") || "{}").p1.title).toBe("Persistence");
            });

            it("rebuilds a corrupt project index without dropping valid projects", async () => {
              const { saveProject, listProjectIndex } = await import("../src/lib/projectStore");
              expect(saveProject("p1", project)).toBe(true);
              localStorage.setItem("openband_project_index", "{broken");
              expect(listProjectIndex().p1.title).toBe("Persistence");
            });

            it("rolls back the project payload when the index write fails", async () => {
              const { saveProject, loadProject } = await import("../src/lib/projectStore");
              expect(saveProject("p1", project)).toBe(true);
              const previous = localStorage.getItem("openband_project_p1");
              const nativeSet = Storage.prototype.setItem;
              let failed = false;
              vi.spyOn(Storage.prototype, "setItem").mockImplementation(function (key: string, value: string) {
                if (key === "openband_project_index" && !failed) {
                  failed = true;
                  throw new Error("quota");
                }
                return nativeSet.call(this, key, value);
              });
              expect(saveProject("p1", { ...project, title: "Should rollback" })).toBe(false);
              expect(localStorage.getItem("openband_project_p1")).toBe(previous);
              expect(loadProject("p1")?.title).toBe("Persistence");
            });

            it("keeps persisted asset bytes resolvable after a module-session reset", async () => {
              const idb = createFakeIndexedDb();
              vi.stubGlobal("indexedDB", idb.indexedDB);
              vi.stubGlobal("URL", { createObjectURL: vi.fn(() => "blob:resolved"), revokeObjectURL: vi.fn() });
              const first = await import("../src/lib/assetStore");
              const pointer = await first.saveAsset(new Blob([new Uint8Array([7, 8, 9])], { type: "audio/wav" }));
              first.revokeAssetCache();
              vi.resetModules();
              const second = await import("../src/lib/assetStore");
              await expect(second.resolveAssetUrl(pointer)).resolves.toBe("blob:resolved");
            });
          });
          ''')
          PY
      - run: npm ci
      - name: Targeted persistence tests
        run: npx vitest run tests/assetStore.test.ts tests/persistenceTrust.test.ts tests/lib.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit implementation
        run: |
          git config user.name "OpenBand Agent"
          git config user.email "openband-agent@users.noreply.github.com"
          git add src/lib/assetStore.ts src/lib/projectStore.ts tests/assetStore.test.ts tests/helpers/fakeIndexedDb.ts tests/persistenceTrust.test.ts
          git commit -m "feat(mvp): harden persistence core"
          git push origin HEAD:agent/48-persistence-trust
