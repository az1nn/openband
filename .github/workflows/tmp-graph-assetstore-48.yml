name: Temporary #48 assetStore impact

on:
  push:
    branches: [ agent/48-persistence-trust ]

jobs:
  assetstore-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run graph:impact -- src/lib/assetStore.ts
