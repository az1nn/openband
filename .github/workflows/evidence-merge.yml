name: OpenBand Evidence Merge

on:
  workflow_run:
    workflows: ["OpenBand CI V2"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  openband-security:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.p.outputs.eligible }}
      pr: ${{ steps.p.outputs.pr }}
      head: ${{ steps.p.outputs.head }}
      tier: ${{ steps.p.outputs.tier }}
      jobs: ${{ steps.p.outputs.jobs }}
    steps:
      - id: p
        uses: actions/github-script@v7
        with:
          script: |
            const run=context.payload.workflow_run,{owner,repo}=context.repo,canon=`${owner}/${repo}`,rank={T0:0,T1:1,T2:2,T3:3,T4:4};
            const fail=m=>core.setFailed(`OpenBand Security BLOCKED: ${m}`);
            const assoc=run.pull_requests||[]; if(assoc.length!==1){fail(`PR count ${assoc.length}`);return}
            const n=assoc[0].number,{data:pr}=await github.rest.pulls.get({owner,repo,pull_number:n});
            core.setOutput('pr',String(n)); core.setOutput('head',pr.head.sha);
            if(pr.state!=='open'||pr.draft){core.setOutput('eligible','false');return}
            if(pr.base.ref!=='master'||!pr.head.repo||pr.head.repo.full_name!==canon||pr.head.sha!==run.head_sha){fail('repository/base/HEAD boundary mismatch');return}
            const {data:mr}=await github.rest.git.getRef({owner,repo,ref:'heads/master'});
            const {data:cmp}=await github.rest.repos.compareCommits({owner,repo,base:mr.object.sha,head:pr.head.sha});
            if(!['ahead','identical'].includes(cmp.status)){fail(`stale base ${cmp.status}`);return}
            const files=await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:n,per_page:100});
            const changed=files.filter(f=>f.status!=='removed').map(f=>f.filename), labels=new Set(pr.labels.map(l=>l.name));
            const trust=changed.some(p=>/^\.github\/workflows\//.test(p)||/^scripts\/(?:ci-merge-gate|sdd-policy-check|security-policy-check)\.mjs$/.test(p)||p==='.specify/memory/constitution.md'||p==='AGENTS.md');
            const tiers=[],triggers=new Set(),checks=new Set(); let v2=0;
            for(const path of changed.filter(p=>/^specs\/[^/]+\/openband\.json$/.test(p))){
              const {data}=await github.rest.repos.getContent({owner,repo,path,ref:pr.head.sha});
              const m=JSON.parse(Buffer.from(data.content,data.encoding||'base64').toString('utf8'));
              if(!(m.tier in rank)){fail(`bad tier ${path}`);return} tiers.push(m.tier); for(const x of m.riskTriggers||[])triggers.add(x);
              if(m.schemaVersion===2){v2++;if(!Array.isArray(m.requiredChecks)||!m.requiredChecks.length){fail('schema v2 missing requiredChecks');return}for(const x of m.requiredChecks)checks.add(x)}
              else if(m.schemaVersion!==1){fail('unsupported metadata schema');return}
            }
            for(const l of labels){const m=/^tier:(T[0-4])$/i.exec(l);if(m)tiers.push(m[1].toUpperCase())}
            if(trust){tiers.push('T4');triggers.add('security-sensitive-privileged-workflow')}
            if(!tiers.length){fail('missing tier');return}
            const tier=tiers.sort((a,b)=>rank[b]-rank[a])[0]; core.setOutput('tier',tier);
            if(rank[tier]>=2&&v2!==1){fail(`T2+ requires one schema v2 metadata file; found ${v2}`);return}
