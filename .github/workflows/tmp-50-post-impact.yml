name: Temporary #50 post-implementation impact

on:
  push:
    branches:
      - agent/50-first-run-e2e

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build graph
        run: npm run graph:build -- --fresh
      - name: Impact — login
        run: npm run graph:impact -- 'app/(auth)/login.tsx' --json
      - name: Impact — onboarding
        run: npm run graph:impact -- src/components/OnboardingFlow.tsx --json
      - name: Impact — first-run helper
        run: npm run graph:impact -- src/lib/firstRun.ts --json
      - name: Impact — feed entry
        run: npm run graph:impact -- app/tabs/index.tsx --json
      - name: Impact — studio route
        run: npm run graph:impact -- 'app/studio/[id].tsx' --json
