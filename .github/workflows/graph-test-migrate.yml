name: Migrate Graph Fixtures

on:
  push:
    branches:
      - agent/38-graph-policy

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[graph-fixtures-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite legacy spec fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'tests/graph-engineer.test.mjs': {
                  'openspec/specs/demo/spec.md': 'specs/demo/spec.md',
              },
              'tests/graph-engineer-v2.test.mjs': {
                  'openspec/specs/g1/spec.md': 'specs/g1/spec.md',
              },
              'tests/graph-engineer-v3.test.mjs': {
                  'openspec/specs/foo.md': 'specs/foo/spec.md',
              },
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in pairs.items():
                  if old not in text:
                      raise SystemExit(f'missing expected fixture reference: {old} in {name}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
      - name: Commit migrated fixtures
        run: |
          rm .github/workflows/graph-test-migrate.yml
          git config user.name "openband-graph-migration"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(graph): migrate legacy fixtures to Spec Kit [graph-fixtures-migrated]"
          git push origin HEAD:agent/38-graph-policy
