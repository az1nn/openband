name: Bootstrap Spec Kit

on:
  push:
    branches:
      - agent/38-speckit-bootstrap

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[speckit-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Install pinned Spec Kit
        run: |
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@v1.0.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap OpenCode integration
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          specify init --here --force --integration opencode --ignore-agent-tools
          specify version
          specify integration status

      - name: Use timestamp feature numbering
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.specify/init-options.json')
          data = json.loads(path.read_text()) if path.exists() else {}
          data['feature_numbering'] = 'timestamp'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Remove one-shot workflow and commit generated files
        run: |
          rm .github/workflows/speckit-bootstrap.yml
          git config user.name "openband-speckit-bootstrap"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore(sdd): bootstrap Spec Kit v1.0.4 [speckit-bootstrap]"
          git push origin HEAD:agent/38-speckit-bootstrap
