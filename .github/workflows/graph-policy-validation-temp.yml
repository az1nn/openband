name: Graph Policy Validation Temp

on:
  push:
    branches:
      - agent/38-graph-policy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: SDD policy
        run: npm run sdd:check
      - name: Spec Kit graph fixtures
        run: npx vitest run tests/graph-speckit.test.mjs
      - name: Architecture Graph CI
        run: npm run graph:ci
      - name: No legacy authority in migrated graph surfaces
        run: |
          if grep -RniE 'openspec' \
            graph \
            agents/graph-engineer.md \
            .agents/skills/openband-improve-architecture/SKILL.md \
            docs/graph-engineering.md \
            docs/graph-engineer-devguide.md \
            docs/graph-engineer.html; then
            echo 'OpenSpec reference remains in migrated graph surfaces' >&2
            exit 1
          fi
