name: Temporary #49 implementation

on:
  push:
    branches:
      - agent/49-export-trust-implementation

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/49-export-trust-implementation
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Apply approved #49 implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          Path("src/lib/exportTrust.ts").write_text(r'''import type { BusDef, Plugin, TrackDef } from "./types";
          import type { Mood } from "./projectTemplates";
          import { MOODS } from "./projectTemplates";
          import { audioBufferToWavBlob } from "./audio";
          import { applyPluginChain } from "./pluginChain";
          import {
            getProjectDurationSeconds,
            renderTrackStem,
          } from "./midiSynth";

          export type ExportTrustErrorCode =
            | "NO_RENDERABLE_CONTENT"
            | "AUDIO_CONTEXT_UNAVAILABLE"
            | "TRACK_RENDER_FAILED"
            | "MASTER_RENDER_FAILED"
            | "INVALID_WAV";

          export class ExportTrustError extends Error {
            constructor(
              public readonly code: ExportTrustErrorCode,
              message: string,
            ) {
              super(message);
              this.name = "ExportTrustError";
            }
          }

          export interface ExportProjectSnapshot {
            tracks: TrackDef[];
            bpm: number;
            mood?: Mood;
            buses: BusDef[];
            masterPlugins: Plugin[];
          }

          export interface ExportWavResult {
            blob: Blob;
            duration: number;
            sampleRate: 44100;
            bitDepth: 16;
          }

          export interface RenderedExportStem {
            track: TrackDef;
            buffer: AudioBuffer;
          }

          function cloneSerializable<T>(value: T): T {
            return JSON.parse(JSON.stringify(value)) as T;
          }

          export function createExportSnapshot(input: {
            tracks: TrackDef[];
            bpm: number;
            mood?: Mood;
            buses?: BusDef[];
            masterPlugins?: Plugin[];
          }): ExportProjectSnapshot {
            return {
              tracks: cloneSerializable(input.tracks),
              bpm: input.bpm,
              mood: input.mood,
              buses: cloneSerializable(input.buses ?? []),
              masterPlugins: cloneSerializable(input.masterPlugins ?? []),
            };
          }

          export function selectRenderableTracks(tracks: TrackDef[]): TrackDef[] {
            const anySolo = tracks.some((track) => track.solo);
            return tracks.filter((track) => {
              if (track.muted) return false;
              if (anySolo && !track.solo) return false;
              return Boolean(
                track.midiNotes?.length ||
                  track.regions?.some((region) => Boolean(region.url)),
              );
            });
          }

          function busGainForTrack(track: TrackDef, buses: Map<string, BusDef>): number {
            const outputId = track.outputId || "master";
            if (outputId === "master") return 1;
            const bus = buses.get(outputId);
            if (!bus) return 1;
            return bus.muted ? 0 : Math.max(0, bus.volume);
          }

          function normalizeSendAmount(value: number): number {
            if (!Number.isFinite(value) || value <= 0) return 0;
            const normalized = value > 1 ? value / 100 : value;
            return Math.max(0, Math.min(1, normalized));
          }

          export function routeGainForTrack(track: TrackDef, buses: BusDef[]): number {
            const busMap = new Map(buses.map((bus) => [bus.id, bus]));
            let gain = busGainForTrack(track, busMap);
            for (const [busId, amount] of Object.entries(track.sends ?? {})) {
              const bus = busMap.get(busId);
              if (!bus || bus.muted) continue;
              gain += normalizeSendAmount(amount) * Math.max(0, bus.volume);
            }
            return gain;
          }

          function makeStereoBuffer(
            left: Float32Array,
            right: Float32Array,
            sampleRate: number,
          ): AudioBuffer {
            if (typeof OfflineAudioContext === "undefined") {
              throw new ExportTrustError(
                "AUDIO_CONTEXT_UNAVAILABLE",
                "Offline audio rendering is unavailable in this browser.",
              );
            }
            const factory = new OfflineAudioContext(2, 1, sampleRate);
            const buffer = factory.createBuffer(2, left.length, sampleRate);
            buffer.getChannelData(0).set(left);
            buffer.getChannelData(1).set(right);
            const closable = factory as { close?: () => Promise<void> };
            if (typeof closable.close === "function") {
              void closable.close().catch(() => undefined);
            }
            return buffer;
          }

          export function mixRenderedStems(
            stems: RenderedExportStem[],
            buses: BusDef[],
            length: number,
            sampleRate: number,
          ): AudioBuffer {
            const left = new Float32Array(length);
            const right = new Float32Array(length);

            for (const { track, buffer } of stems) {
              const routeGain = routeGainForTrack(track, buses);
              if (routeGain === 0) continue;
              const sourceLeft = buffer.getChannelData(0);
              const sourceRight =
                buffer.numberOfChannels > 1
                  ? buffer.getChannelData(1)
                  : sourceLeft;
              const samples = Math.min(length, buffer.length, sourceLeft.length, sourceRight.length);
              for (let i = 0; i < samples; i++) {
                left[i] += sourceLeft[i] * routeGain;
                right[i] += sourceRight[i] * routeGain;
              }
            }

            return makeStereoBuffer(left, right, sampleRate);
          }

          async function applyMood(
            buffer: AudioBuffer,
            mood: Mood | undefined,
            sampleRate: number,
          ): Promise<AudioBuffer> {
            const preset = mood ? MOODS.find((item) => item.id === mood) : undefined;
            if (!preset) return buffer;
            if (typeof OfflineAudioContext === "undefined") {
              throw new ExportTrustError(
                "AUDIO_CONTEXT_UNAVAILABLE",
                "Offline audio rendering is unavailable in this browser.",
              );
            }

            const ctx = new OfflineAudioContext(2, Math.max(1, buffer.length), sampleRate);
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            let output: AudioNode = source;

            if (preset.filter) {
              const filter = ctx.createBiquadFilter();
              filter.type = preset.filter.type;
              filter.frequency.value = preset.filter.freq;
              filter.Q.value = preset.filter.q;
              output.connect(filter);
              output = filter;
            }

            if (preset.reverb) {
              const dryGain = ctx.createGain();
              dryGain.gain.value = 1 - preset.reverb.mix * 0.7;
              const wetGain = ctx.createGain();
              wetGain.gain.value = preset.reverb.mix;
              const irDuration = Math.min(preset.reverb.decay, 10);
              const irLength = Math.max(1, Math.ceil(sampleRate * irDuration));
              const impulse = ctx.createBuffer(2, irLength, sampleRate);
              for (let channel = 0; channel < 2; channel++) {
                const data = impulse.getChannelData(channel);
                for (let i = 0; i < data.length; i++) {
                  data[i] =
                    (Math.random() * 2 - 1) *
                    Math.exp(-i / (sampleRate * 0.5));
                }
              }
              const convolver = ctx.createConvolver();
              convolver.buffer = impulse;
              output.connect(dryGain);
              dryGain.connect(ctx.destination);
              output.connect(convolver);
              convolver.connect(wetGain);
              wetGain.connect(ctx.destination);
            } else {
              output.connect(ctx.destination);
            }

            source.start(0);
            const rendered = await ctx.startRendering();
            const closable = ctx as { close?: () => Promise<void> };
            if (typeof closable.close === "function") {
              void closable.close().catch(() => undefined);
            }
            return rendered;
          }

          function ascii(view: DataView, offset: number, length: number): string {
            let out = "";
            for (let i = 0; i < length; i++) out += String.fromCharCode(view.getUint8(offset + i));
            return out;
          }

          export async function validateWavBlob(blob: Blob): Promise<void> {
            if (!(blob instanceof Blob) || blob.size <= 44) {
              throw new ExportTrustError("INVALID_WAV", "Export did not produce a non-empty WAV file.");
            }
            const bytes = await blob.arrayBuffer();
            const view = new DataView(bytes);
            if (bytes.byteLength < 44 || ascii(view, 0, 4) !== "RIFF" || ascii(view, 8, 4) !== "WAVE") {
              throw new ExportTrustError("INVALID_WAV", "Exported audio is not a valid RIFF/WAVE file.");
            }

            let offset = 12;
            let dataSize = 0;
            while (offset + 8 <= view.byteLength) {
              const id = ascii(view, offset, 4);
              const size = view.getUint32(offset + 4, true);
              if (id === "data") {
                dataSize = Math.min(size, Math.max(0, view.byteLength - offset - 8));
                break;
              }
              offset += 8 + size + (size % 2);
            }
            if (dataSize <= 0) {
              throw new ExportTrustError("INVALID_WAV", "Exported WAV has no audio data payload.");
            }
          }

          export async function renderProjectWav(
            input: {
              tracks: TrackDef[];
              bpm: number;
              mood?: Mood;
              buses?: BusDef[];
              masterPlugins?: Plugin[];
            },
            onProgress?: (pct: number) => void,
          ): Promise<ExportWavResult> {
            const snapshot = createExportSnapshot(input);
            const duration = getProjectDurationSeconds(snapshot.tracks, snapshot.bpm);
            if (!(duration > 0)) {
              throw new ExportTrustError(
                "NO_RENDERABLE_CONTENT",
                "This project has no renderable audio or MIDI content to export.",
              );
            }

            const renderable = selectRenderableTracks(snapshot.tracks);
            if (renderable.length === 0) {
              throw new ExportTrustError(
                "NO_RENDERABLE_CONTENT",
                "The current mute/solo state has no renderable project content.",
              );
            }

            const sampleRate = 44100 as const;
            const targetLength = Math.max(1, Math.ceil(duration * sampleRate));
            const stems: RenderedExportStem[] = [];
            onProgress?.(5);

            for (let index = 0; index < renderable.length; index++) {
              const track = renderable[index];
              let buffer: AudioBuffer | null;
              try {
                buffer = await renderTrackStem(
                  track,
                  snapshot.bpm,
                  duration,
                  snapshot.buses,
                  { strict: true },
                );
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                throw new ExportTrustError(
                  "TRACK_RENDER_FAILED",
                  `Could not render track "${track.name}": ${message}`,
                );
              }
              if (!buffer) {
                throw new ExportTrustError(
                  "TRACK_RENDER_FAILED",
                  `Could not render track "${track.name}".`,
                );
              }
              stems.push({ track, buffer });
              onProgress?.(10 + Math.round(((index + 1) / renderable.length) * 60));
            }

            let mixed = mixRenderedStems(stems, snapshot.buses, targetLength, sampleRate);
            mixed = await applyMood(mixed, snapshot.mood, sampleRate);
            onProgress?.(80);

            if (snapshot.masterPlugins.length > 0) {
              try {
                mixed = await applyPluginChain(mixed, snapshot.masterPlugins, sampleRate, { duration });
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                throw new ExportTrustError(
                  "MASTER_RENDER_FAILED",
                  `Could not render the master effect chain: ${message}`,
                );
              }
            }

            const blob = audioBufferToWavBlob(mixed, 16);
            onProgress?.(95);
            await validateWavBlob(blob);
            onProgress?.(100);
            return { blob, duration, sampleRate, bitDepth: 16 };
          }
          '''.replace("          ", "", 1))

          # Strict stem rendering is opt-in; default playback behavior stays tolerant.
          replace_once(
              "src/lib/midiSynth.ts",
              '''export async function renderTrackStem(\n  track: TrackDef[],''',
              '''export async function renderTrackStem(\n  track: TrackDef[],''',
          ) if False else None

          replace_once(
              "src/lib/midiSynth.ts",
              '''export async function renderTrackStem(\n  track: TrackDef,\n  bpm: number,\n  duration: number,\n  _buses?: BusDef[],\n): Promise<AudioBuffer | null> {''',
              '''export interface RenderTrackStemOptions {\n  strict?: boolean;\n}\n\nexport async function renderTrackStem(\n  track: TrackDef,\n  bpm: number,\n  duration: number,\n  _buses?: BusDef[],\n  options: RenderTrackStemOptions = {},\n): Promise<AudioBuffer | null> {''',
          )
          replace_once(
              "src/lib/midiSynth.ts",
              '''      } catch (e) {\n        console.warn("Failed to decode region for stem", track.name, e);\n      }''',
              '''      } catch (e) {\n        if (options.strict) throw e;\n        console.warn("Failed to decode region for stem", track.name, e);\n      }''',
          )
          replace_once(
              "src/lib/midiSynth.ts",
              '''        decodedRegions,\n      );\n      const procBuf = await applyPluginChain(trackBuf, track.plugins, sampleRate, {''',
              '''        decodedRegions,\n        options.strict ?? false,\n      );\n      const procBuf = await applyPluginChain(trackBuf, track.plugins, sampleRate, {''',
          )
          replace_once(
              "src/lib/midiSynth.ts",
              '''        } catch (e) {\n          console.warn("Failed to schedule region for stem", track.name, e);\n        }''',
              '''        } catch (e) {\n          if (options.strict) throw e;\n          console.warn("Failed to schedule region for stem", track.name, e);\n        }''',
          )
          replace_once(
              "src/lib/midiSynth.ts",
              '''  } catch (e) {\n    console.warn("renderTrackStem failed:", e);\n    return null;\n  }\n}\n\nasync function renderTrackBuffer(''',
              '''  } catch (e) {\n    if (options.strict) throw e;\n    console.warn("renderTrackStem failed:", e);\n    return null;\n  }\n}\n\nasync function renderTrackBuffer(''',
          )
          replace_once(
              "src/lib/midiSynth.ts",
              '''  decodedRegions: { buffer: AudioBuffer; start: number; duration: number }[],\n): Promise<AudioBuffer> {''',
              '''  decodedRegions: { buffer: AudioBuffer; start: number; duration: number }[],\n  strict: boolean = false,\n): Promise<AudioBuffer> {''',
          )
          replace_once(
              "src/lib/midiSynth.ts",
              '''    } catch (e) {\n      console.warn("Failed to schedule region for track buffer", track.name, e);\n    }''',
              '''    } catch (e) {\n      if (strict) throw e;\n      console.warn("Failed to schedule region for track buffer", track.name, e);\n    }''',
          )

          Path("src/components/BounceDialog.tsx").write_text(r'''import { useState, useCallback } from "react";
          import { View, Text, Modal, Pressable, Alert, Platform } from "react-native";
          import { ProgressBar } from "./ProgressBar";
          import { audioSystem } from "../lib/universalAudio";
          import type { BusDef, Plugin, TrackDef } from "../lib/types";
          import type { Mood } from "../lib/projectTemplates";
          import { ExportTrustError, renderProjectWav, validateWavBlob } from "../lib/exportTrust";
          import { exportVideo, downloadVideoFile, VideoExportOptions, isVideoExportSupported, renderVideoJob } from "../lib/videoExport";

          type ExportMode = "audio" | "video";

          const VIDEO_FORMATS: { key: "webm" | "mp4"; label: string; ext: string }[] = [
            { key: "webm", label: "WebM", ext: ".webm" },
            { key: "mp4", label: "MP4", ext: ".mp4" },
          ];

          interface BounceDialogProps {
            visible: boolean;
            onClose: () => void;
            projectTitle: string;
            duration: number;
            bpm?: number;
            tracks?: TrackDef[];
            buses?: BusDef[];
            masterPlugins?: Plugin[];
            mood?: Mood;
            testID?: string;
          }

          function safeBaseName(title: string): string {
            return title.replace(/[^a-zA-Z0-9_-]/g, "").replace(/\s+/g, "_") || "openband";
          }

          export function BounceDialog({
            visible,
            onClose,
            projectTitle,
            duration,
            bpm = 120,
            tracks = [],
            buses = [],
            masterPlugins = [],
            mood,
            testID,
          }: BounceDialogProps) {
            const [mode, setMode] = useState<ExportMode>("audio");
            const [videoFormat, setVideoFormat] = useState<"webm" | "mp4">("webm");
            const [exporting, setExporting] = useState(false);
            const [progress, setProgress] = useState(0);
            const [videoColor, setVideoColor] = useState("#6366f1");
            const [video, setVideo] = useState(false);

            const updateProgress = useCallback((pct: number) => {
              setProgress(pct);
            }, []);

            const handleVideoExport = useCallback(async () => {
              setExporting(true);
              setProgress(0);

              if (!isVideoExportSupported()) {
                Alert.alert(
                  "Vídeo indisponível",
                  "A exportação de vídeo requer um navegador web compatível.",
                );
                setExporting(false);
                return;
              }

              try {
                await audioSystem.initialize();
                const ext = VIDEO_FORMATS.find((f) => f.key === videoFormat)?.ext || ".webm";
                const videoTracks = tracks.map((t) => ({
                  id: t.id,
                  name: t.name,
                  volume: t.volume,
                  pan: t.pan,
                  muted: t.muted,
                  solo: t.solo,
                  regions: t.regions.map((r) => ({
                    ...r,
                    color: t.name.toLowerCase().includes("drum") ? "#f59e0b"
                      : t.name.toLowerCase().includes("bass") ? "#10b981"
                      : t.name.toLowerCase().includes("vocal") ? "#ec4899"
                      : videoColor,
                  })),
                }));
                const videoOptions: VideoExportOptions = {
                  width: 1080,
                  height: 1920,
                  title: projectTitle,
                  color: videoColor,
                  format: videoFormat,
                };
                const result = await exportVideo(
                  videoTracks,
                  bpm,
                  Math.min(duration, 300),
                  videoOptions,
                  updateProgress,
                );
                updateProgress(95);
                const filename = `${safeBaseName(projectTitle)}_video${ext}`;
                await downloadVideoFile(result.blob, filename, updateProgress);
                updateProgress(100);
                Alert.alert("Exportado", `Vídeo exportado como ${videoFormat.toUpperCase()}`);
              } catch (e) {
                console.error("Video export failed:", e);
                Alert.alert("Erro", "Falha ao exportar vídeo. O recurso requer um navegador web compatível.");
              } finally {
                setExporting(false);
              }
            }, [videoFormat, projectTitle, duration, bpm, tracks, videoColor, updateProgress]);

            const handleExport = useCallback(async () => {
              if (mode === "video") {
                await handleVideoExport();
                return;
              }

              setExporting(true);
              setProgress(0);
              try {
                await audioSystem.initialize();
                let blob: Blob;
                let sampleRate = 44100;
                let bitDepth = Platform.OS === "web" ? 16 : 24;

                if (Platform.OS === "web") {
                  const result = await renderProjectWav(
                    { tracks, bpm, mood, buses, masterPlugins },
                    updateProgress,
                  );
                  blob = result.blob;
                  sampleRate = result.sampleRate;
                  bitDepth = result.bitDepth;
                } else {
                  if (tracks.length === 0) {
                    throw new ExportTrustError(
                      "NO_RENDERABLE_CONTENT",
                      "This project has no renderable content to export.",
                    );
                  }
                  blob = await audioSystem.renderMixdown(
                    tracks,
                    duration,
                    44100,
                    updateProgress,
                    buses,
                  );
                  await validateWavBlob(blob);
                }

                const filename = `${safeBaseName(projectTitle)}_mix.wav`;
                await audioSystem.exportToFile(blob, filename);
                updateProgress(100);
                Alert.alert(
                  "Exportado",
                  `Mix exportado como WAV (${bitDepth}-bit, ${(sampleRate / 1000).toFixed(1)}kHz)`,
                );

                if (video) {
                  if (!isVideoExportSupported()) {
                    Alert.alert(
                      "Vídeo indisponível",
                      "A exportação de vídeo requer um navegador web compatível.",
                    );
                  } else {
                    const result = await renderVideoJob({
                      durationSec: Math.min(duration, 300),
                      fps: 30,
                      onProgress: updateProgress,
                    });
                    const videoFilename = `${safeBaseName(projectTitle)}_video.webm`;
                    await audioSystem.exportToFile(result.blob, videoFilename);
                    Alert.alert("Vídeo exportado", `Vídeo salvo como ${videoFilename}`);
                  }
                }
              } catch (e) {
                console.error("Export failed:", e);
                const message = e instanceof ExportTrustError
                  ? e.message
                  : "Falha ao exportar mix. O projeto não foi alterado.";
                Alert.alert("Erro", message);
              } finally {
                setExporting(false);
              }
            }, [mode, projectTitle, duration, tracks, bpm, mood, buses, masterPlugins, updateProgress, video, handleVideoExport]);

            return (
              <Modal
                visible={visible}
                transparent
                animationType="fade"
                onRequestClose={onClose}
                testID={testID}
              >
                <Pressable
                  className="flex-1 bg-black/60 justify-center items-center px-6"
                  onPress={onClose}
                >
                  <Pressable className="w-full max-w-sm bg-dark-surface rounded-3xl border border-dark-border p-5">
                    <Text className="text-white text-lg font-bold mb-1">Exportar Mix</Text>
                    <Text className="text-gray-500 text-xs mb-5">Exportação de áudio confiável para lançamento</Text>

                    <Text className="label mb-2">Mode</Text>
                    <View className="flex-row gap-2 mb-4">
                      <Pressable
                        onPress={() => setMode("audio")}
                        className={`flex-1 py-2.5 rounded-xl items-center border ${mode === "audio" ? "bg-brand-primary/20 border-brand-primary" : "bg-dark-elevated border-dark-border"}`}
                      >
                        <Text className={`text-sm font-semibold ${mode === "audio" ? "text-brand-primary" : "text-white"}`}>Audio</Text>
                      </Pressable>
                      <Pressable
                        onPress={() => setMode("video")}
                        className={`flex-1 py-2.5 rounded-xl items-center border ${mode === "video" ? "bg-brand-accent/20 border-brand-accent" : "bg-dark-elevated border-dark-border"}`}
                      >
                        <Text className={`text-sm font-semibold ${mode === "video" ? "text-brand-accent" : "text-white"}`}>Video</Text>
                      </Pressable>
                    </View>

                    <View className="flex-row items-center justify-between mb-4">
                      <Text className="label">Vídeo</Text>
                      <Pressable
                        onPress={() => setVideo(!video)}
                        className={`px-4 py-2 rounded-xl border ${video ? "bg-brand-accent/20 border-brand-accent" : "bg-dark-elevated border-dark-border"}`}
                      >
                        <Text className={`text-sm font-semibold ${video ? "text-brand-accent" : "text-white"}`}>{video ? "Ligado" : "Desligado"}</Text>
                      </Pressable>
                    </View>

                    {mode === "audio" ? (
                      <View className="mb-5 rounded-xl border border-brand-primary/30 bg-brand-primary/10 p-3">
                        <Text className="text-brand-primary font-bold text-sm">WAV</Text>
                        <Text className="text-gray-400 text-xs mt-1">
                          {Platform.OS === "web" ? "16-bit · 44.1kHz · full project mix" : "44.1kHz · native WAV mix"}
                        </Text>
                      </View>
                    ) : (
                      <>
                        <Text className="label mb-2">Formato</Text>
                        <View className="flex-row gap-2 mb-4">
                          {VIDEO_FORMATS.map((f) => (
                            <Pressable
                              key={f.key}
                              onPress={() => setVideoFormat(f.key)}
                              className={`flex-1 py-2.5 rounded-xl items-center border ${videoFormat === f.key ? "bg-brand-accent/20 border-brand-accent" : "bg-dark-elevated border-dark-border"}`}
                            >
                              <Text className={`text-sm font-semibold ${videoFormat === f.key ? "text-brand-accent" : "text-white"}`}>{f.label}</Text>
                            </Pressable>
                          ))}
                        </View>
                        <Text className="label mb-2">Cor do waveform</Text>
                        <View className="flex-row gap-2 mb-5">
                          {["#6366f1", "#ec4899", "#10b981", "#f59e0b", "#ef4444", "#3b82f6"].map((c) => (
                            <Pressable
                              key={c}
                              onPress={() => setVideoColor(c)}
                              className={`w-8 h-8 rounded-full items-center justify-center ${videoColor === c ? "border-2 border-white" : "border-2 border-transparent"}`}
                              style={{ backgroundColor: c } as Record<string, string>}
                            >
                              {videoColor === c && <Text className="text-white text-xs">{"\u2713"}</Text>}
                            </Pressable>
                          ))}
                        </View>
                      </>
                    )}

                    {exporting && (
                      <View className="mb-5">
                        <ProgressBar progress={progress} className="mb-2" />
                        <Text className="text-gray-400 text-xs text-center">{progress}%</Text>
                      </View>
                    )}
