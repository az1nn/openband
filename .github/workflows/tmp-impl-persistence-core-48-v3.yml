name: Temporary #48 persistence core implementation v3

on:
  push:
    branches: [ agent/48-persistence-trust ]

permissions:
  contents: write

jobs:
  implement-core:
    if: contains(github.event.head_commit.message, 'run persistence core v3')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/48-persistence-trust
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Reapply approved core patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, textwrap

          text = Path('.github/workflows/tmp-impl-persistence-core-48-v2.yml').read_text()
          start_marker = '      - name: Patch persistence core and tests\n        run: |\n'
          end_marker = '      - run: npm ci\n'
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          script = textwrap.dedent(text[start:end])
          subprocess.run(['bash', '-e'], input=script, text=True, check=True)
          PY
      - name: Fix module-reset URL test harness
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/persistenceTrust.test.ts')
          text = p.read_text()
          old = '''    vi.stubGlobal("URL", { createObjectURL: vi.fn(() => "blob:resolved"), revokeObjectURL: vi.fn() });'''
          new = '''    const urlCtor = globalThis.URL as typeof URL & {\n      createObjectURL?: (blob: Blob) => string;\n      revokeObjectURL?: (url: string) => void;\n    };\n    Object.defineProperty(urlCtor, "createObjectURL", {\n      configurable: true,\n      value: vi.fn(() => "blob:resolved"),\n    });\n    Object.defineProperty(urlCtor, "revokeObjectURL", {\n      configurable: true,\n      value: vi.fn(),\n    });'''
          if old not in text:
              raise SystemExit('URL test harness target not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - name: Targeted persistence tests
        run: npx vitest run tests/assetStore.test.ts tests/persistenceTrust.test.ts tests/lib.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit implementation
        run: |
          git config user.name "OpenBand Agent"
          git config user.email "openband-agent@users.noreply.github.com"
          git add src/lib/assetStore.ts src/lib/projectStore.ts tests/assetStore.test.ts tests/helpers/fakeIndexedDb.ts tests/persistenceTrust.test.ts
          git commit -m "feat(mvp): harden persistence core"
          git push origin HEAD:agent/48-persistence-trust
