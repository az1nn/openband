name: Temporary #48 persistence Studio integration

on:
  push:
    branches: [ agent/48-persistence-trust ]

permissions:
  contents: write

jobs:
  implement-studio:
    if: contains(github.event.head_commit.message, 'run persistence studio integration')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/48-persistence-trust
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Apply approved Studio persistence integration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one target in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          hooks = Path('app/studio/hooks.ts')
          h = hooks.read_text()
          old_manual = '''  const handleManualSave = useCallback(() => {
            save();
            flashLabel(t("studio.savedToast", "Saved ✓"));
          }, [save, flashLabel, t]);'''
          new_manual = '''  const reportSaveResult = useCallback(
            (saved: boolean, successLabel: string) => {
              flashLabel(saved ? successLabel : t("studio.saveFailed", "Save failed"));
            },
            [flashLabel, t],
          );

          const handleManualSave = useCallback(() => {
            reportSaveResult(save(), t("studio.savedToast", "Saved ✓"));
          }, [save, reportSaveResult, t]);'''
          if old_manual not in h:
              raise SystemExit('manual save block not found')
          h = h.replace(old_manual, new_manual, 1)

          old_auto = '''  // Debounced autosave whenever the snapshot content changes.
          useEffect(() => {
            const timer = setTimeout(() => {
              save();
              flashLabel(t("studio.saved", "Saved"));
            }, 2000);
            return () => clearTimeout(timer);
          }, [snapshot, id, save, flashLabel, t]);

          useEffect(
            () => () => {
              if (labelTimerRef.current) clearTimeout(labelTimerRef.current);
            },
            [],
          );'''
          new_auto = '''  // Debounced autosave whenever the snapshot content changes.
          useEffect(() => {
            const timer = setTimeout(() => {
              reportSaveResult(save(), t("studio.saved", "Saved"));
            }, 2000);
            return () => clearTimeout(timer);
          }, [snapshot, id, save, reportSaveResult, t]);

          // Do not rely only on the debounce when a Web page is backgrounded/closed.
          useEffect(() => {
            if (Platform.OS !== "web" || typeof window === "undefined") return;
            const flushLatestSnapshot = () => {
              save();
            };
            window.addEventListener("pagehide", flushLatestSnapshot);
            return () => window.removeEventListener("pagehide", flushLatestSnapshot);
          }, [save]);

          useEffect(
            () => () => {
              if (labelTimerRef.current) clearTimeout(labelTimerRef.current);
            },
            [],
          );'''
          if old_auto not in h:
              raise SystemExit('autosave block not found')
          hooks.write_text(h.replace(old_auto, new_auto, 1))

          helper = Path('app/studio/persistenceTrust.ts')
          helper.write_text('''import type { TrackDef } from "../../src/lib/types";

          export interface ImportableAudioFile extends Blob {
            name: string;
          }

          export async function persistImportedAudioFiles(params: {
            files: readonly ImportableAudioFile[];
            existingTrackCount: number;
            trackColors: readonly string[];
            persistAsset: (blob: Blob) => Promise<string>;
          }): Promise<{ tracks: TrackDef[]; failedNames: string[] }> {
            const { files, existingTrackCount, trackColors, persistAsset } = params;
            const tracks: TrackDef[] = [];
            const failedNames: string[] = [];
            const batchId = Date.now();

            for (let i = 0; i < files.length; i++) {
              const file = files[i];
              try {
                const url = await persistAsset(file);
                const approxDuration = Math.max(10, Math.round(file.size / 30000));
                tracks.push({
                  id: `import-${batchId}-${i}`,
                  name: file.name.replace(/\\.[^/.]+$/, ""),
                  color: trackColors[(existingTrackCount + i) % trackColors.length] ?? "#888888",
                  muted: false,
                  solo: false,
                  volume: 75,
                  pan: 0,
                  sends: {},
                  sidechainSource: null,
                  regions: [
                    {
                      id: `region-import-${batchId}-${i}`,
                      start: i * 4,
                      duration: Math.min(approxDuration, 300),
                      url,
                    },
                  ],
                  plugins: [],
                  automation: {},
                });
              } catch {
                failedNames.push(file.name);
              }
            }

            return { tracks, failedNames };
          }

          export async function resolvePersistedTrackAssets(
            tracks: readonly TrackDef[],
            resolveAsset: (url: string) => Promise<string>,
          ): Promise<string[]> {
            const pointers = new Set<string>();
            for (const track of tracks) {
              for (const region of track.regions) {
                if (region.url?.startsWith("asset://")) pointers.add(region.url);
              }
            }

            const missing: string[] = [];
            await Promise.all(
              [...pointers].map(async (pointer) => {
                try {
                  await resolveAsset(pointer);
                } catch {
                  missing.push(pointer);
                }
              }),
            );
            return missing.sort();
          }
          ''')

          studio = Path('app/studio/[id].tsx')
          s = studio.read_text()
          import_anchor = 'import { getPlayheadBeat, setPlayheadBeat, subscribePlayhead } from "../../src/lib/playheadStore";'
          helper_import = 'import { persistImportedAudioFiles, resolvePersistedTrackAssets } from "./persistenceTrust";\n'
          if import_anchor not in s:
              raise SystemExit('Studio import anchor not found')
          s = s.replace(import_anchor, helper_import + import_anchor, 1)

          hydration_pattern = re.compile(r'''  useEffect\(\(\) => \{\n    for \(const t of tracks\) \{\n      for \(const r of t\.regions\) \{\n        if \(r\.url && r\.url\.startsWith\("asset://"\)\) \{\n          resolveAssetUrl\(r\.url\)\.catch\(\(e\) => console\.warn\("resolve asset url failed", e\)\);\n        \}\n      \}\n    \}\n  \}, \[tracks\]\);''')
          hydration_replacement = '''  const reportedMissingAssetsRef = useRef(new Set<string>());
          useEffect(() => {
            let cancelled = false;
            void resolvePersistedTrackAssets(tracks, resolveAssetUrl).then((missing) => {
              if (cancelled) return;
              const fresh = missing.filter((pointer) => !reportedMissingAssetsRef.current.has(pointer));
              if (fresh.length === 0) return;
              fresh.forEach((pointer) => reportedMissingAssetsRef.current.add(pointer));
              Alert.alert(
                t("studio.assetMissingTitle", "Audio unavailable"),
                t(
                  "studio.assetMissingMessage",
                  "Some local audio could not be restored. The project structure was kept intact.",
                ),
              );
            });
            return () => {
              cancelled = true;
            };
          }, [tracks, t]);'''
          s, count = hydration_pattern.subn(hydration_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'hydration block not found: {count}')

          import_pattern = re.compile(r'''  const handleImportAudio = useCallback\(\(\) => \{.*?\n  \}, \[tracks, setTracks\]\);''', re.S)
          import_replacement = '''  const handleImportAudio = useCallback(() => {
            if (Platform.OS !== "web") {
              Alert.alert(
                t("studio.importTitle", "Import"),
                t("studio.importWebOnly", "Importing is only available in the web version."),
              );
              return;
            }
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".wav,.mp3,.aiff,.flac,.ogg,.m4a,audio/*";
            input.multiple = true;
            input.onchange = async (e: Event) => {
              const files = (e.target as HTMLInputElement).files;
              if (!files || files.length === 0) return;

              const { tracks: importedTracks, failedNames } = await persistImportedAudioFiles({
                files: Array.from(files),
                existingTrackCount: tracks.length,
                trackColors: TRACK_COLORS,
                persistAsset: saveAsset,
              });

              if (importedTracks.length > 0) {
                setTracks([...tracks, ...importedTracks]);
              }
              if (failedNames.length > 0) {
                Alert.alert(
                  t("studio.importFailedTitle", "Import incomplete"),
                  t(
                    "studio.importFailedMessage",
                    "Some audio files could not be stored locally and were not added to the project.",
                  ),
                );
              }
            };
            input.click();
          }, [tracks, setTracks, t]);'''
          s, count = import_pattern.subn(import_replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'import audio block not found: {count}')
          studio.write_text(s)

          Path('tests/studioPersistenceTrust.test.tsx').write_text('''import { act, renderHook } from "@testing-library/react";
          import { afterEach, beforeEach, describe, expect, it, vi } from "vitest";

          const store = vi.hoisted(() => ({
            saveProject: vi.fn(),
            loadProject: vi.fn(() => null),
          }));

          vi.mock("../src/lib/projectStore", () => ({
            saveProject: store.saveProject,
            loadProject: store.loadProject,
          }));

          vi.mock("react-i18next", () => ({
            useTranslation: () => ({ t: (_key: string, fallback: string) => fallback }),
          }));

          import { useStudioPersistence } from "../app/studio/hooks";

          const snapshot = {
            title: "Project",
            tracks: [],
            groups: [],
            buses: [],
            trackAssignments: {},
            masterPlugins: [],
            masteringChain: [],
            sendBuses: [],
            trackAmpChains: {},
            mixSnapshots: [],
            metronome: {},
            recordSettings: {},
          } as any;

          describe("Studio persistence trust", () => {
            beforeEach(() => {
              vi.useFakeTimers();
              store.saveProject.mockReset().mockReturnValue(true);
              store.loadProject.mockReset().mockReturnValue(null);
            });

            afterEach(() => {
              vi.useRealTimers();
            });

            it("shows manual-save success only after a successful project write", () => {
              const { result } = renderHook(() =>
                useStudioPersistence({ id: "p1", snapshot, hydrate: vi.fn() }),
              );
              act(() => result.current.handleManualSave());
              expect(result.current.lastSavedLabel).toBe("Saved ✓");
            });

            it("shows an explicit failure label when manual save fails", () => {
              store.saveProject.mockReturnValue(false);
              const { result } = renderHook(() =>
                useStudioPersistence({ id: "p1", snapshot, hydrate: vi.fn() }),
              );
              act(() => result.current.handleManualSave());
              expect(result.current.lastSavedLabel).toBe("Save failed");
            });

            it("reports autosave failure instead of claiming Saved", () => {
              store.saveProject.mockReturnValue(false);
              const { result } = renderHook(() =>
                useStudioPersistence({ id: "p1", snapshot, hydrate: vi.fn() }),
              );
              act(() => vi.advanceTimersByTime(2000));
              expect(result.current.lastSavedLabel).toBe("Save failed");
            });

            it("flushes the latest snapshot on Web pagehide", () => {
              renderHook(() => useStudioPersistence({ id: "p1", snapshot, hydrate: vi.fn() }));
              store.saveProject.mockClear();
              act(() => window.dispatchEvent(new Event("pagehide")));
              expect(store.saveProject).toHaveBeenCalledTimes(1);
            });
          });
          ''')

          Path('tests/studioAssetPersistence.test.ts').write_text('''import { describe, expect, it, vi } from "vitest";
          import {
            persistImportedAudioFiles,
            resolvePersistedTrackAssets,
          } from "../app/studio/persistenceTrust";

          function audioFile(name: string, size = 60000): File {
            return new File([new Uint8Array(size)], name, { type: "audio/wav" });
          }

          describe("Studio persisted audio integration", () => {
            it("adds an imported track only after durable asset persistence resolves", async () => {
              let resolveWrite!: (value: string) => void;
              const persistAsset = vi.fn(
                () => new Promise<string>((resolve) => { resolveWrite = resolve; }),
              );
              let settled = false;
              const pending = persistImportedAudioFiles({
                files: [audioFile("take.wav")],
                existingTrackCount: 0,
                trackColors: ["#fff"],
                persistAsset,
              }).then((value) => {
                settled = true;
                return value;
              });

              await Promise.resolve();
              expect(settled).toBe(false);
              resolveWrite("asset://take");
              const result = await pending;
              expect(result.failedNames).toEqual([]);
              expect(result.tracks).toHaveLength(1);
              expect(result.tracks[0].regions[0].url).toBe("asset://take");
            });

            it("does not create project state for files whose durable write fails", async () => {
              const persistAsset = vi
                .fn()
                .mockResolvedValueOnce("asset://good")
                .mockRejectedValueOnce(new Error("quota"));
              const result = await persistImportedAudioFiles({
                files: [audioFile("good.wav"), audioFile("bad.wav")],
                existingTrackCount: 2,
                trackColors: ["#a", "#b"],
                persistAsset,
              });
              expect(result.tracks).toHaveLength(1);
              expect(result.tracks[0].regions[0].url).toBe("asset://good");
              expect(result.failedNames).toEqual(["bad.wav"]);
            });

            it("reports unique missing persisted pointers without changing project structure", async () => {
              const tracks = [
                {
                  id: "t1",
                  regions: [
                    { id: "r1", start: 0, duration: 1, url: "asset://missing" },
                    { id: "r2", start: 1, duration: 1, url: "asset://missing" },
                    { id: "r3", start: 2, duration: 1, url: "asset://ok" },
                  ],
                },
              ] as any;
              const resolve = vi.fn(async (url: string) => {
                if (url === "asset://missing") throw new Error("missing");
                return "blob:ok";
              });
              const before = JSON.stringify(tracks);
              await expect(resolvePersistedTrackAssets(tracks, resolve)).resolves.toEqual([
                "asset://missing",
              ]);
              expect(JSON.stringify(tracks)).toBe(before);
              expect(resolve).toHaveBeenCalledTimes(2);
            });
          });
          ''')
          PY
      - run: npm ci
      - name: Focused persistence tests
        run: npx vitest run tests/assetStore.test.ts tests/persistenceTrust.test.ts tests/studioPersistenceTrust.test.tsx tests/studioAssetPersistence.test.ts tests/studioHooksFixes.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit Studio integration
        run: |
          git config user.name "OpenBand Agent"
          git config user.email "openband-agent@users.noreply.github.com"
          git add app/studio/hooks.ts app/studio/'[id].tsx' app/studio/persistenceTrust.ts tests/studioPersistenceTrust.test.tsx tests/studioAssetPersistence.test.ts
          git commit -m "feat(mvp): make Studio persistence truthful"
          git push origin HEAD:agent/48-persistence-trust
