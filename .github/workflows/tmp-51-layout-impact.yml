name: Temporary #51 root shell impact

on:
  push:
    branches:
      - agent/51-web-release-readiness

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run graph:build -- --fresh
      - name: Impact — root auth shell
        run: npm run graph:impact -- app/_layout.tsx --json
