name: SDD Validation Temp

on:
  push:
    branches:
      - agent/38-governance-workflow

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Spec Kit
        run: |
          python -m pip install --disable-pip-version-check uv
          uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@v1.0.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate workflow definitions
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          specify workflow add ./sdd/openband-design.yml --dev
          specify workflow add ./sdd/openband-build.yml --dev
          specify workflow list
      - name: Validate feature metadata schema
        run: |
          uv run --with jsonschema python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path('sdd/openband.schema.json').read_text())
          Draft202012Validator.check_schema(schema)
          data = json.loads(Path('specs/20260910-093500-governance-workflow/openband.json').read_text())
          Draft202012Validator(schema).validate(data)
          PY
      - name: Assert governance invariants
        run: |
          ! grep -qi 'OpenSpec SDD Loop' AGENTS.md
          grep -q 'HUMAN DESIGN GATE' AGENTS.md
          grep -q 'HUMAN MERGE GATE' AGENTS.md
          grep -q '"specs/\*\*": "allow"' opencode.json
          ! grep -q '"app/\*\*": "allow"' opencode.json
