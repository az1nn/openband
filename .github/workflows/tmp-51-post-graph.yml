name: Temporary #51 post-implementation graph

on:
  push:
    branches:
      - agent/51-web-release-readiness

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Build graph
        run: npm run graph:build -- --fresh
      - name: Impact — public root
        run: npm run graph:impact -- app/index.tsx --json
      - name: Impact — root auth shell
        run: npm run graph:impact -- app/_layout.tsx --json
      - name: Impact — launch landing
        run: npm run graph:impact -- src/components/WebLaunchLanding.tsx --json
      - name: Impact — login
        run: npm run graph:impact -- 'app/(auth)/login.tsx' --json
      - name: Impact — feed host
        run: npm run graph:impact -- app/tabs/index.tsx --json
      - name: Impact — onboarding
        run: npm run graph:impact -- src/components/OnboardingFlow.tsx --json
