name: OpenCode Profile Smoke Temp

on:
  push:
    branches:
      - agent/38-governance-workflow

permissions:
  contents: write

jobs:
  smoke:
    if: ${{ !contains(github.event.head_commit.message, '[opencode-smoke-pass]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install pinned OpenCode
        run: npm install -g opencode-ai@1.18.30
      - name: Verify version and project agents
        run: |
          set -euo pipefail
          version="$(opencode --version)"
          echo "OpenCode: $version"
          echo "$version" | grep -F '1.18.30'
          agents="$(opencode agent list)"
          printf '%s\n' "$agents"
          echo "$agents" | grep -E '(^|[[:space:]])speckit([[:space:]]|$)'
          echo "$agents" | grep -E '(^|[[:space:]])build([[:space:]]|$)'
          opencode --agent speckit --help >/dev/null
          opencode --agent build --help >/dev/null
      - name: Verify least-privilege config remains explicit
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('opencode.json', 'utf8'));
          if (!cfg.agent?.speckit || !cfg.agent?.build) throw new Error('missing speckit/build agents');
          if (cfg.agent.speckit.permission?.edit?.['*'] !== 'deny') throw new Error('speckit wildcard edit must deny');
          if (cfg.agent.speckit.permission?.edit?.['specs/**'] !== 'allow') throw new Error('speckit specs edit must allow');
          if (cfg.agent.build.permission?.edit !== 'allow') throw new Error('build edit must allow');
          for (const agent of ['speckit', 'build']) {
            const bash = cfg.agent[agent].permission?.bash;
            if (!bash) throw new Error(`${agent} bash policy missing`);
          }
          console.log('OpenCode profile policy: PASS');
          NODE
      - name: Remove smoke workflow after success
        run: |
          rm .github/workflows/opencode-profile-smoke-temp.yml
          git config user.name "openband-opencode-smoke"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(sdd): record OpenCode 1.18.30 profile smoke [opencode-smoke-pass]"
          git push origin HEAD:agent/38-governance-workflow
