name: Temporary #51 title hydration patch

on:
  push:
    branches:
      - agent/51-web-release-readiness

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'chore run title hydration patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/51-web-release-readiness
          fetch-depth: 0
      - name: Apply exact hydration patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/studio/[id].tsx')
          source = path.read_text()
          old = '''  const hydrateProject = useCallback((saved: ProjectData) => {
            setTracks(saved.tracks as TrackDef[]);
          '''
          new = '''  const hydrateProject = useCallback((saved: ProjectData) => {
            if (typeof saved.title === "string" && saved.title.trim()) {
              setProjectTitle(saved.title);
            }
            setTracks(saved.tracks as TrackDef[]);
          '''
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one hydrateProject anchor, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name "Alan"
          git config user.email "80423834+az1nn@users.noreply.github.com"
          git add 'app/studio/[id].tsx'
          git diff --cached --check
          git commit -m "fix persistence hydrate saved project title on reload"
          git push origin HEAD:agent/51-web-release-readiness
