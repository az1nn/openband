name: Temporary #49 graph impact

on:
  push:
    branches:
      - agent/49-export-trust

jobs:
  graph-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run graph:build
      - name: universalAudio impact
        run: npm run graph:impact -- src/lib/universalAudio.ts
      - name: BounceDialog impact
        run: npm run graph:impact -- src/components/BounceDialog.tsx
      - name: StudioModals impact
        run: npm run graph:impact -- app/studio/StudioModals.tsx
      - name: audio encoder impact
        run: npm run graph:impact -- src/lib/audio.ts
