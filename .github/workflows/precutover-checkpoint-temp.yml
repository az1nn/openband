name: Pre-Cutover Checkpoint Temp

on:
  push:
    branches:
      - agent/38-openspec-cutover

permissions:
  contents: write

jobs:
  checkpoint:
    if: ${{ !contains(github.event.head_commit.message, '[precutover-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Remove final live legacy path dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/features-implementation.md')
          text = path.read_text()
          old = 'Post-implementation stabilization across six archived changes (see `openspec/archive/`):'
          new = 'Post-implementation stabilization across six historical hardening changes (preserved in Git history):'
          if old not in text:
              raise SystemExit('expected legacy path reference not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Validate manifest coverage against live legacy tree
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path('docs/migrations/openspec-manifest.md').read_text()
          missing = []
          total = 0
          for group in ('specs', 'changes', 'archive'):
              base = Path('openspec') / group
              for entry in sorted(base.iterdir(), key=lambda p: p.name):
                  total += 1
                  if f'`{entry.name}`' not in manifest:
                      missing.append(f'{group}/{entry.name}')
          if missing:
              raise SystemExit('manifest missing: ' + ', '.join(missing))
          print(f'manifest coverage: PASS ({total} top-level units)')
          PY

      - name: Assert no live path dependency outside migration archaeology
        run: |
          python - <<'PY'
          from pathlib import Path
          allowed_prefixes = (
              'docs/migrations/',
              'specs/20260910-093500-governance-workflow/',
              'specs/20260910-094400-knowledge-agents/',
              'specs/20260910-182300-graph-policy/',
              'specs/20260910-183500-openspec-cutover/',
              'openspec/',
          )
          ignored_parts = {'.git', 'node_modules', '.openband'}
          bad = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in ignored_parts for part in path.parts):
                  continue
              rel = path.as_posix().lstrip('./')
              if rel.startswith(allowed_prefixes):
                  continue
              try:
                  text = path.read_text(errors='ignore')
              except OSError:
                  continue
              if 'openspec/' in text.lower():
                  bad.append(rel)
          if bad:
              raise SystemExit('live openspec/ path dependencies: ' + ', '.join(sorted(bad)))
          print('live OpenSpec path dependency audit: PASS')
          PY

      - run: npm ci
      - name: SDD policy
        run: npm run sdd:check
      - name: Graph regression suite
        run: npm run test:graph-sdd
      - name: Architecture Graph CI
        run: npm run graph:ci

      - name: Commit reconciled checkpoint tree
        run: |
          rm .github/workflows/precutover-checkpoint-temp.yml
          git config user.name "openband-speckit-cutover"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(sdd): finalize pre-cutover checkpoint [precutover-ready]"
          git push origin HEAD:agent/38-openspec-cutover

      - name: Create immutable annotated OpenSpec checkpoint
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/openspec-final >/dev/null 2>&1; then
            echo 'openspec-final already exists; refusing to move or overwrite it' >&2
            exit 1
          fi
          git tag -a openspec-final -m "OpenBand final reconciled OpenSpec checkpoint before Spec Kit-only cutover. See docs/migrations/openspec-manifest.md and Issue #38." HEAD
          git push origin refs/tags/openspec-final
          echo "openspec-final -> $(git rev-parse HEAD)"
