name: Temporary #49 render impact

on:
  push:
    branches:
      - agent/49-export-trust

jobs:
  graph-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run graph:build
      - name: midiSynth impact
        run: npm run graph:impact -- src/lib/midiSynth.ts
      - name: busRouter impact
        run: npm run graph:impact -- src/lib/busRouter.ts
      - name: pluginChain impact
        run: npm run graph:impact -- src/lib/pluginChain.ts
      - name: Studio route impact
        run: npm run graph:impact -- app/studio/[id].tsx
