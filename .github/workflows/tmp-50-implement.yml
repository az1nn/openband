            );

            const handleProjectClose = useCallback(() => {
              setShowProject(false);
              onClose();
            }, [onClose]);

            const handleStartFromScratch = useCallback(
              (result: ProjectStarterResult) => {
                setShowProject(false);
                onStartFromScratch?.(result);
                onClose();
