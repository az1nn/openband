          describe("AuthContext onboarding flag", () => {
            function OnboardingProbe() {
              const { hasOnboarded, completeOnboarding } = useAuth();
              return (
                <>
                  <Text testID="hasOnboarded">{String(hasOnboarded)}</Text>
