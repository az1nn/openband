name: Knowledge Audit Temp

on:
  push:
    branches:
      - agent/38-knowledge-agents

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Removed artifact references
        run: |
          set +e
          grep -RniE 'openband-(to-spec|to-tickets|implement|handoff-keeper)|docs/(chatgpt-handoff|HY3-HANDOFF|pending-implementations|unimplemented-specs)' \
            .agents .opencode .qwen .claude agents docs README.md ROADMAP.md \
            --exclude-dir=openspec --exclude='openspec-to-speckit.md'
          exit 0
      - name: OpenSpec references outside legacy and migration history
        run: |
          set +e
          grep -RniE 'openspec' .agents .opencode .qwen .claude agents docs README.md ROADMAP.md \
            --exclude='openspec-to-speckit.md'
          exit 0
