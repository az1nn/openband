name: Temporary #48 Graph Impact

on:
  push:
    branches: [ agent/48-persistence-trust ]

jobs:
  graph-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Validate graph
        run: npm run graph:validate
      - name: Persistence impact
        run: |
          echo '=== projectStore ==='
          npm run graph:impact -- src/lib/projectStore.ts
          echo '=== studio hooks ==='
          npm run graph:impact -- app/studio/hooks.ts
          echo '=== openband format ==='
          npm run graph:impact -- src/lib/openbandFormat.ts
          echo '=== state/asset separation ==='
          npm run graph:impact -- src/lib/stateAssetSeparation.ts
          echo '=== object storage ==='
          npm run graph:impact -- src/lib/objectStorage.ts
