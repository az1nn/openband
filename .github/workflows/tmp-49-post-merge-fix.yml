name: "Temporary #49 post-merge repair"

on:
  push:
    branches:
      - agent/49-post-merge-validation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/49-post-merge-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Reconcile stale tests with launch export contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('tests/components.test.tsx')
          text = p.read_text()
          pattern = r'  it\("switches format", \(\) => \{\n.*?\n  \}\);'
          replacement = "\n".join([
              '  it("offers WAV as the only launch audio format", () => {',
              '    render(',
              '      <BounceDialog',
              '        visible={true}',
              '        onClose={() => {}}',
              '        projectTitle="Test"',
              '        duration={120}',
              '      />,',
              '    );',
              '    expect(screen.getByText("WAV")).toBeTruthy();',
              '    expect(screen.queryByText("AIFF")).toBeNull();',
              '    expect(screen.queryByText("FLAC")).toBeNull();',
              '    expect(screen.queryByText("MP3")).toBeNull();',
              '  });',
          ])
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one stale BounceDialog test, replaced {count}')
          p.write_text(text)

          p = Path('tests/studio-audio-pure.test.ts')
          text = p.read_text()
          pattern = r'vi\.mock\("\.\./src/lib/universalAudio", \(\) => \(\{\n\s*getSharedAudioContext: vi\.fn\(\(\) => \(\{ currentTime: 0 \}\)\),\n\}\)\);'
          replacement = "\n".join([
              'vi.mock("../src/lib/universalAudio", () => ({',
              '  getSharedAudioContext: vi.fn(() => ({ currentTime: 0 })),',
              '  createTrackedBlob: vi.fn((_blob: unknown) => "blob:mock"),',
              '  markBlobActive: vi.fn(),',
              '  revokeTrackedBlob: vi.fn(),',
              '}));',
          ])
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected one universalAudio mock, replaced {count}')
          p.write_text(text)
          PY
      - name: Targeted regression verification
        run: npx vitest run tests/components.test.tsx tests/studio-audio-pure.test.ts
      - name: Commit product-test repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "OpenBand Agent"
          git config user.email "80423834+az1nn@users.noreply.github.com"
          git rm .github/workflows/tmp-49-post-merge-fix.yml
          git add tests/components.test.tsx tests/studio-audio-pure.test.ts
          git commit -m "test(export): reconcile post-merge launch contract"
          git push origin HEAD:agent/49-post-merge-validation
